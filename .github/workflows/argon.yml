# Argon-Workflow: lässt Gemini 4 Argon Aufgaben aus Issues bearbeiten.
#
# Auslöser:
#   1. Ein Issue bekommt das Label `agent:argon`           -> Argon bearbeitet das Issue
#   2. Kommentar, der mit `/argon` beginnt (Issue oder PR) -> Argon arbeitet weiter / bessert nach
#      (nur von OWNER/MEMBER/COLLABORATOR, damit Fremde Argon nicht steuern können)
#
# Sicherheitsprinzip: Das Modell bekommt KEIN GitHub-Token. Es ändert nur Dateien im
# Arbeitsverzeichnis. Commit, Push und PR-Erstellung machen die festen Schritte danach.
#
# Einrichtung: siehe docs/KOLLABORATION.md, Abschnitt "Einrichtung".

name: Argon (Gemini 4 Argon)

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: argon-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  argon:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent:argon')
      || (github.event_name == 'issue_comment'
          && startsWith(github.event.comment.body, '/argon')
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUM: ${{ github.event.issue.number }}
      IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
      BASE: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Start melden
        run: |
          gh issue comment "$NUM" --repo "$REPO" --body "🤖 Argon arbeitet an dieser Aufgabe … ([Run]($RUN_URL))"

      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Branch bestimmen
        id: branch
        run: |
          if [ "$IS_PR" = "true" ]; then
            head=$(gh pr view "$NUM" --repo "$REPO" --json headRefName -q .headRefName)
            cross=$(gh pr view "$NUM" --repo "$REPO" --json isCrossRepository -q .isCrossRepository)
            if [ "$cross" = "true" ] || [[ "$head" != argon/* ]]; then
              gh issue comment "$NUM" --repo "$REPO" --body "Argon arbeitet nur auf eigenen \`argon/*\`-Branches in diesem Repo. Abgebrochen."
              exit 1
            fi
            branch="$head"
          else
            branch="argon/issue-$NUM"
          fi
          if git rev-parse --verify --quiet "origin/$branch" >/dev/null; then
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch"
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Aufgabe für Argon vorbereiten
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          mkdir -p .argon
          {
            printf '# Aufgabe: %s\n\n' "$TITLE"
            printf '## Issue/PR #%s\n\n%s\n\n' "$NUM" "$BODY"
            if [ -n "$COMMENT" ]; then
              printf '## Neuer Auftrag / Feedback (hat Vorrang)\n\n%s\n' "${COMMENT#/argon}"
            fi
          } > .argon/task.md

      - name: Argon ausführen
        id: argon
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL || 'gemini-4-argon' }}
          settings: |-
            {
              "model": { "maxSessionTurns": 80 }
            }
          prompt: |-
            Du bist Argon, Spezialist in einem Team mit Claude (Lead).
            Lies zuerst GEMINI.md und AGENTS.md im Repo-Root und halte dich daran.
            Deine Aufgabe steht in .argon/task.md. Der richtige Branch ist bereits ausgecheckt.
            Bearbeite die Aufgabe direkt im Arbeitsverzeichnis und bleib im angegebenen Scope.
            Führe vorhandene Build-/Lint-/Test-Befehle aus, wenn es welche gibt.
            Nicht committen, nicht pushen, keine Pull Requests anlegen – das erledigt der Workflow.
            Beende mit einer Zusammenfassung: Geändert / Getestet / Offene Punkte.

      - name: Commit, Push und PR
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          TITLE: ${{ github.event.issue.title }}
          SUMMARY: ${{ steps.argon.outputs.summary }}
        run: |
          git config user.name "Argon (Gemini)"
          git config user.email "argon-bot@users.noreply.github.com"
          git add -A
          # Arbeitsdateien und Workflow-Dateien nie committen
          git reset -q -- .argon .gemini gemini-artifacts .github 2>/dev/null || true
          printf '%s\n' "$SUMMARY" > .argon/summary.md

          if git diff --cached --quiet; then
            { echo "Argon hat keine Dateien geändert."; echo; cat .argon/summary.md; } > .argon/comment.md
            gh issue comment "$NUM" --repo "$REPO" --body-file .argon/comment.md
            exit 0
          fi

          git commit -q -m "argon: ${TITLE} (#${NUM})"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            case "$TITLE" in "[Argon]"*) prtitle="$TITLE" ;; *) prtitle="[Argon] $TITLE" ;; esac
            {
              echo "Closes #$NUM"
              echo
              echo "## Zusammenfassung von Argon"
              cat .argon/summary.md
              echo
              echo "---"
              echo "Review durch Claude (Lead) ausstehend. Nachbesserung: Kommentar mit \`/argon <Feedback>\`."
            } > .argon/pr.md
            gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" --title "$prtitle" --body-file .argon/pr.md
          else
            { echo "Neue Änderungen von Argon auf \`$BRANCH\` gepusht."; echo; cat .argon/summary.md; } > .argon/comment.md
            gh issue comment "$NUM" --repo "$REPO" --body-file .argon/comment.md
          fi

      - name: Fehler melden
        if: failure()
        run: |
          gh issue comment "$NUM" --repo "$REPO" --body "⚠️ Argon-Run fehlgeschlagen. Details: $RUN_URL"
