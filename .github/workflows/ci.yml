# CI (10 §1): Lint, Typen, Tests, Codegen-Prüfung, Contract-Tests, Secret-Scanning.
# Swift: Contract-Check im Swift-6-Sprachmodus unter Linux; die iPad-App baut und testet der Job `ipad` auf einem macOS-Runner im Simulator.
# Der Mac-Helfer `sg-tunnel` (apps/mac-tunnel) baut und testet der Job `mac-tunnel` auf einem macOS-Runner (UX-12, PR 3).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (Lint, Typen, Tests, Codegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generierte Schemas aktuell?
        run: pnpm schemas:check
      - name: Web-App bauen (Static Export, pdf.js-Beiwerk, Theme-Skript im Payload)
        run: |
          pnpm --filter @sg/web build
          node apps/web/scripts/check-theme-init.mjs --strict
      - name: Backup-Tests mit root (Besitzerprüfung #182/#183)
        working-directory: infra/sg
        run: |
          ROOT_TMP="$(sudo mktemp -d)"; echo "ROOT_TMP=$ROOT_TMP" >> "$GITHUB_ENV"
          sudo env "PATH=$PATH" SG_ROOT_TESTS=1 TMPDIR="$ROOT_TMP" CI=true \
            node_modules/.bin/vitest run test/backup.test.ts -t '\[root\]' \
            --reporter=default --reporter=json --outputFile="$ROOT_TMP/root.json"
          sudo cat "$ROOT_TMP/root.json" | node -e '
            const r=JSON.parse(require("fs").readFileSync(0,"utf8"));
            const t=r.testResults.flatMap(f=>f.assertionResults).filter(a=>a.fullName.includes("[root]"));
            const bad=t.filter(a=>a.status!=="passed");
            console.log(`Root-Tests: ${t.length} gefunden, ${t.length-bad.length} bestanden`);
            if(t.length<9||bad.length) { console.error(bad.map(a=>a.fullName+": "+a.status).join("\n")); process.exit(1); }'
      - name: Aufräumen nach root-Lauf
        if: always()
        run: |
          [ -n "${ROOT_TMP:-}" ] && sudo rm -rf "$ROOT_TMP"
          sudo chown -R "$(id -u):$(id -g)" infra/sg

  integration:
    name: Integration (Core + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sg
          POSTGRES_PASSWORD: sg
          POSTGRES_DB: sg_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sg" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sg:sg@localhost:5432/sg_test
      # Leistungstest (VERTRAEGE §19.6) läuft lokal, Zeitmessungen auf geteilten Runnern schwanken
      SG_SKIP_SEARCH_PERF: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --workspace-concurrency=1 --if-present run test:integration

  python:
    name: Python (Schemas, Worker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sg
          POSTGRES_PASSWORD: sg
          POSTGRES_DB: sg_worker
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sg" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sg:sg@localhost:5432/sg_worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Contract-Tests (Pydantic)
        working-directory: packages/schemas
        run: uv run --project python --locked pytest python/tests -q
      - name: Worker (ruff, mypy, pytest)
        if: hashFiles('services/worker/pyproject.toml') != ''
        working-directory: services/worker
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
          uv run --locked pytest -q

  swift:
    name: Swift-Contract (Codable gegen Beispiele)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Swift ist auf ubuntu-latest vorinstalliert; die Version steht im Log
      - run: swift --version
      - name: Schemas.swift + swift-support kompilieren, Sync-Beispiele und Striche round-trippen
        run: bash packages/schemas/swift-support/check.sh

  changes:
    name: Änderungen (welche macOS-Jobs nötig sind)
    runs-on: ubuntu-latest
    outputs:
      ipad: ${{ steps.mac.outputs.ipad }}
      spike_p2p: ${{ steps.mac.outputs.spike_p2p }}
      mac_tunnel: ${{ steps.mac.outputs.mac_tunnel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: mac
        run: bash scripts/ci/mac-changes.sh

  ipad:
    needs: changes
    # Läuft nur bei Bedarf (siehe Job `changes`); übersprungen zählt als erfolgreich.
    # Bei leerer Ausgabe (changes fehlgeschlagen) wird gebaut.
    if: ${{ !cancelled() && needs.changes.outputs.ipad != 'false' }}
    name: iPad-App (Build und Tests im Simulator)
    # macOS-Runner sind für öffentliche Repos kostenlos
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Xcode-Version
        run: xcodebuild -version
      - name: Xcode-Projekt erzeugen (XcodeGen)
        run: bash apps/ipad/scripts/projekt-erzeugen.sh
      - name: iPad-Simulator wählen
        id: simulator
        run: |
          udid="$(bash apps/ipad/scripts/ci-simulator.sh)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: App bauen und Tests ausführen
        run: |
          set -o pipefail
          xcodebuild test \
            -project apps/ipad/StudienGehirn.xcodeproj \
            -scheme StudienGehirn \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Fehler aus dem Build-Log (Kurzfassung)
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/xcodebuild.log" ]; then
            grep -nE "error:|\*\* (BUILD|TEST) FAILED|XCTAssert|: failed" "$RUNNER_TEMP/xcodebuild.log" | head -200 || true
          fi

  spike-p2p:
    needs: changes
    # Läuft nur bei Bedarf (siehe Job `changes`); übersprungen zählt als erfolgreich.
    # Bei leerer Ausgabe (changes fehlgeschlagen) wird gebaut.
    if: ${{ !cancelled() && needs.changes.outputs.spike_p2p != 'false' }}
    name: Spike S6 (Mac-Teil bauen und testen)
    # Mac-Paket des Spikes für die Direktverbindung (UX-12, PR 1): swift build, swift test mit Loopback-Tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Swift-Version
        run: swift --version
      - name: Bauen
        run: swift build --package-path spikes/s6-p2p
      - name: Tests (Befehle, Rahmen, Loopback mit TLS-PSK)
        run: |
          set -o pipefail
          swift test --package-path spikes/s6-p2p 2>&1 | tee "$RUNNER_TEMP/spike-test.log"
      - name: Verfahrenstabelle (Loopback)
        if: always()
        run: grep -A8 "Selbsttest über Loopback" "$RUNNER_TEMP/spike-test.log" || true

  mac-tunnel:
    needs: changes
    # Läuft nur bei Bedarf (siehe Job `changes`); übersprungen zählt als erfolgreich.
    # Bei leerer Ausgabe (changes fehlgeschlagen) wird gebaut.
    if: ${{ !cancelled() && needs.changes.outputs.mac_tunnel != 'false' }}
    name: Mac-Helfer sg-tunnel (bauen und testen)
    # UX-12, PR 3: Swift-Paket apps/mac-tunnel. Bauen wie `sg start` (release), `swift test` mit Testvektoren aus dem Vertrag,
    # Loopback-Tests (TLS-PSK-Client -> Listener -> Fake-Core am Unix-Socket) und Tests der Schlüsseldatei. Kein Funk, kein Bonjour.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Swift-Version
        run: swift --version
      - name: Bauen (release, wie "sg start")
        run: swift build -c release --package-path apps/mac-tunnel
      - name: Programm startet (Hilfe und Argumentprüfung)
        run: |
          apps/mac-tunnel/.build/release/sg-tunnel --help
          # Ohne Pflichtargumente bricht der Helfer mit Code 64 ab
          set +e
          apps/mac-tunnel/.build/release/sg-tunnel
          code=$?
          set -e
          test "$code" -eq 64
      - name: Tests (Testvektoren, Schlüsseldatei, Loopback mit Fake-Core)
        run: |
          set -o pipefail
          swift test --package-path apps/mac-tunnel 2>&1 | tee "$RUNNER_TEMP/mac-tunnel-test.log"
      - name: Fehler aus dem Testlauf (Kurzfassung)
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/mac-tunnel-test.log" ]; then
            grep -nE "error:|failed|XCTAssert" "$RUNNER_TEMP/mac-tunnel-test.log" | head -100 || true
          fi

  secrets:
    name: Secret-Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks liest die Commits des PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
