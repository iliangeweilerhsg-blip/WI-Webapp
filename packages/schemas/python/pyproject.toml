[project]
name = "sg-schemas"
version = "0.0.0"
description = "Generierte Pydantic-Modelle aus packages/schemas (nicht von Hand ändern)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[dependency-groups]
dev = ["pytest>=8", "datamodel-code-generator==0.88.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sg_schemas"]
