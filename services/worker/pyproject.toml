[project]
name = "sg-worker"
version = "0.0.0"
description = "Studien-Gehirn: Python-Worker (Job-Schleife und Pipeline)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sg-schemas",
    "psycopg[binary]==3.3.7",
    "pymupdf==1.28.2",
    "pillow==13.0.0",
]

[project.scripts]
sg-worker = "sg_worker.__main__:main"

[dependency-groups]
dev = ["ruff==0.17.3", "mypy==2.4.1", "pytest==9.2.0"]

[tool.uv.sources]
sg-schemas = { path = "../../packages/schemas/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/sg_worker/jobs.py" = ["E501"]  # SQL-Texte
"tests/conftest.py" = ["E501"]  # SQL aus VERTRAEGE §3

[tool.mypy]
files = ["src"]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
# PyMuPDF liefert keine Typannotationen
module = "sg_worker.handlers.pdf_ingest"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
