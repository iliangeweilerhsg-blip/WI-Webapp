[project]
name = "sg-worker"
version = "0.0.0"
description = "Studien-Gehirn: Python-Worker (Job-Schleife und Pipeline)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sg-schemas",
    "psycopg[binary]==3.3.7",
    "pymupdf==1.28.2",
    "pillow==13.0.0",
    # Claude API (VERTRAEGE §20.5): alle Plattformen. 2.3.0 (23.10.2026) ist das neueste Release,
    # das beim Einbau (11.11.2026) mindestens zwei Wochen alt war.
    "anthropic==2.3.0",
    # Transkription (VERTRAEGE §18.6): nur auf Apple Silicon. Linux und CI nutzen den Fake.
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Embeddings (VERTRAEGE §19.2, bge-m3): nur auf Apple Silicon. Linux und CI nutzen den Fake.
    "sentence-transformers==6.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
sg-worker = "sg_worker.__main__:main"

[dependency-groups]
dev = ["ruff==0.17.3", "mypy==2.4.1", "pytest==9.2.0"]

[tool.uv.sources]
sg-schemas = { path = "../../packages/schemas/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Bewusst nur das Paket: `prompts/` liegt neben `src/` und gehört nicht ins Wheel. Der Worker läuft
# aus dem Quellbaum (`uv run --project services/worker sg-worker`, editierbare Installation, siehe
# infra/sg/src/commands.ts); die Handler lesen `<Projekt>/prompts/…`. `tests/test_units.py` prüft,
# dass jede Prompt-Datei existiert. Ein Wheel-Betrieb bräuchte `force-include` und neue Pfade.
[tool.hatch.build.targets.wheel]
packages = ["src/sg_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/sg_worker/jobs.py" = ["E501"]  # SQL-Texte
"tests/conftest.py" = ["E501"]  # SQL aus VERTRAEGE §3
"src/sg_worker/handlers/maintenance.py" = ["E501"]  # SQL-Texte
"tests/test_maintenance.py" = ["E501"]
"src/sg_worker/progress.py" = ["E501"]  # Referenz-SQL aus VERTRAEGE §18.2

[tool.mypy]
files = ["src"]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
# PyMuPDF liefert keine Typannotationen
module = "sg_worker.handlers.pdf_ingest"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
